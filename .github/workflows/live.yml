name: Cotizaciones en vivo
on:
  schedule:
    - cron: '*/15 7-21 * * 1-5'   # cada 15 min con las bolsas de Europa y EE. UU. abiertas
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: true
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Últimos precios
        run: python scripts/live_quotes.py
      - name: Guardar
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cotizaciones $(date -u +%H:%M)"
          for i in 1 2 3 4; do if git pull --rebase -X theirs origin main && git push; then exit 0; fi; git rebase --abort 2>/dev/null; sleep 6; done
