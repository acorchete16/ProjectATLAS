name: Texturas Atlántida
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/assets/fetch_textures.py', '.github/workflows/textures.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Descargar texturas CC0
        run: python scripts/assets/fetch_textures.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/tex
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Texturas CC0 para la Atlántida"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
