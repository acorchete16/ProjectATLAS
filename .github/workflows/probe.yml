name: Probe fuentes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/tools/probe.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tools/probe.py
      - run: |
          git config user.name "atlas-bot"; git config user.email "atlas-bot@users.noreply.github.com"
          git add data/probe.txt; git commit -m "probe" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
