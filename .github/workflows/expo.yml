name: Composición de ETFs (exposición)
on:
  schedule:
    - cron: '40 5 * * *'   # diario: justETF limita peticiones, se completa por tandas (datos válidos 6 días)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/holdings.py', '.github/workflows/expo.yml']
permissions:
  contents: write
concurrency:
  group: expo
  cancel-in-progress: true
jobs:
  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Carteras completas (iShares/Invesco) y composición (Yahoo)
        run: python scripts/holdings.py
      - name: Guardar
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/expo.json data/expo_log.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Composición de ETFs $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do if git pull --rebase -X theirs origin main && git push; then exit 0; fi; git rebase --abort 2>/dev/null; sleep 6; done
