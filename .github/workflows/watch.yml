name: Ones to watch
on:
  schedule:
    - cron: '10 6-20/2 * * 1-5'
    - cron: '10 10 * * 0,6'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/watch.py', '.github/workflows/watch.yml']
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Noticias y señales
        run: python scripts/watch.py
      - name: Guardar
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/watch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ones to watch $(date -u +%H:%M)"
          for i in 1 2 3 4; do if git pull --rebase -X theirs origin main && git push; then exit 0; fi; git rebase --abort 2>/dev/null; sleep 6; done
