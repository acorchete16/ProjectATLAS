name: Recursos Svalbard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/assets/svalbard_assets.py', '.github/workflows/svalbard.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy rasterio
      - name: Relieve real + texturas CC0
        run: python scripts/assets/svalbard_assets.py
      - name: Guardar
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/svb
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Recursos Svalbard (Copernicus DEM + Poly Haven CC0)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
