name: Precios diarios
on:
  schedule:
    - cron: '35 17 * * 1-5'   # tras el cierre europeo
    - cron: '25 21 * * 1-5'   # tras el cierre de EE. UU.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_prices.py', 'data/symbols.json', '.github/workflows/prices.yml']
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar precios
        run: python scripts/fetch_prices.py
      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/prices.json data/symbols.json data/prices_log.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Precios diarios $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
